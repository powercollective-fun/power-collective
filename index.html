<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sidebar Layout</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #111827;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      padding: 20px 0;
    }

    .sidebar h2 {
      margin: 0 20px 20px;
      font-size: 18px;
    }

    .nav-link {
      padding: 10px 20px;
      color: #e5e7eb;
      text-decoration: none;
      display: block;
      font-size: 14px;
    }

    .nav-link:hover {
      background: #1f2937;
    }

    .nav-link.active {
      background: #2563eb;
    }

    /* Main content */
    .main {
      flex: 1;
      background: #f3f4f6;
      padding: 20px;
      overflow-y: auto;
    }

    .main h1 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>PowerCollective</h2>
    <a href="index.html" class="nav-link active">Home</a>
    <a href="LICENSE.md" class="nav-link">License</a>
    <a href="contact.html" class="nav-link">Contact</a>
  </div>

  <div class="main">
    <h1>Home</h1>
    <p>Welcome to the site. This is your main content area.</p>
  </div>
</body>
</html>
